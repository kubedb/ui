{{- $name := include "clickhouse-ui.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data "app-secret-key") }}
  # Rotating the key would make credentials already encrypted in the SQLite database undecryptable.
  app-secret-key: {{ index $existing.data "app-secret-key" | quote }}
  {{- else }}
  app-secret-key: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
